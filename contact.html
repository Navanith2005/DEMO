<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <form action="">
    <h1>CONTACT US</h1>
    <label >NAME:</label><br>
        <input type="text" required placeholder="please enter your name"><br><br>
    <label >EMAIL ADDRESS:</label><br>
        <input type="email" required placeholder="please enter your email"><br><br>
    <label for="phno">Enter Phone Number::</label><br>
  <input type="text" id="phno" name="phno" maxlength="10" size="10" placeholder="please enter your phone number"><br><br>
  <label for="subject">Subject:</label><br>
    <input type="text" id="subject" name="subject" required placeholder="Enter subject" maxlength="100"><br><br>
 <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" cols="40" required placeholder="Type your message here..."></textarea><br><br>
  <button type="submit">SUBMIT</button><br><br>
 &copy;copyright 2026
 </form>
</body>
</html>
